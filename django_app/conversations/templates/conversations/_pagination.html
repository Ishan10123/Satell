{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}" aria-label="Previous page">← Previous</a>{% else %}<span class="disabled">← Previous</span>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}" aria-label="Next page">Next →</a>{% else %}<span class="disabled">Next →</span>{% endif %}
</nav>{% endif %}
