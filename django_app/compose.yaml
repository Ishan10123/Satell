services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "startup.py", "gunicorn", "config.wsgi:application", "--control-socket", "/tmp/gunicorn.ctl", "--bind", "0.0.0.0:8000", "--workers", "1", "--timeout", "135", "--graceful-timeout", "125", "--keep-alive", "2"]
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 135s
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the environment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?Read POSTGRES_DB from the existing rag-postgres container}
      POSTGRES_USER: ${POSTGRES_USER:?Read POSTGRES_USER from the existing rag-postgres container}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Read POSTGRES_PASSWORD from the existing rag-postgres container}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_CONNECT_TIMEOUT: "5"
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-rag_django_test_20261118}
      RAG_ADAPTER: http
      RAG_API_BASE_URL: http://rag-api:8000
      RAG_API_TOKEN: ${RAG_API_TOKEN:?Set RAG_API_TOKEN to the same local FastAPI bearer credential}
      RAG_API_TIMEOUT_SECONDS: ${RAG_API_TIMEOUT_SECONDS:-120}
      RAG_API_TOP_K: ${RAG_API_TOP_K:-8}
      DJANGO_SECURE_COOKIES: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      SMTP_HOST: ${SMTP_HOST:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-0}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Satell}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.invalid}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-http://127.0.0.1:8001}
      PASSWORD_RESET_TIMEOUT_SECONDS: ${PASSWORD_RESET_TIMEOUT_SECONDS:-3600}
      PASSWORD_RESET_RATE_LIMIT: ${PASSWORD_RESET_RATE_LIMIT:-5}
      PASSWORD_RESET_RATE_WINDOW_SECONDS: ${PASSWORD_RESET_RATE_WINDOW_SECONDS:-3600}
    ports:
      - "127.0.0.1:${DJANGO_HOST_PORT:-8001}:8000"
    networks:
      - rag-app-network
      - chat-rag
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/accounts/login/', timeout=20).read()"
      interval: 30s
      timeout: 22s
      retries: 3
      start_period: 150s

networks:
  rag-app-network:
    name: rag-app-network
    external: true
  chat-rag:
    name: satell-chat-rag
    external: true
